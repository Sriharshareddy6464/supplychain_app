services:
  api:
    build: .
    container_name: aggregator_api
    env_file:
      - .env
    depends_on:
      - db
    ports:
      - "8000:8000"
    volumes:
      - .:/app

  db:
    image: postgres:15
    container_name: aggregator_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Ash@6464}
      POSTGRES_DB: ${POSTGRES_DB:-aggregator_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
