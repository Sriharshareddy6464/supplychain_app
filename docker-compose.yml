services:
  db:
    image: postgres:15
    container_name: aggregator_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=Ash@6464
      - POSTGRES_DB=aggregator_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d aggregator_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aggregator_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:Ash%406464@db:5432/aggregator_db
      - PYTHONUNBUFFERED=1
      - SECRET_KEY=supersecretkey
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - ENV=development
      - PROJECT_NAME=SupplyChainAPI
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: >
      sh -c "python -m alembic upgrade head && PYTHONPATH=/app python scripts/seed.py || true && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    image: node:20-alpine
    container_name: aggregator_frontend
    working_dir: /app
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
    command: sh -c "npm install axios && npm run dev -- --host 0.0.0.0"

volumes:
  postgres_data:
